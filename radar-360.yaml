# GeekMagic Radar 360 (model RD03, stock firmware id "radar21en") on ESPHome.
# 2.1" round 360x360 panel, GC9B72-compatible controller, 4-wire SPI. ESP32-S3R8 (8 MB octal PSRAM),
# 16 MB flash. Pins were found by on-device scans; the case was never opened (see docs/).
#
#   SPI CLK   GPIO12        Panel TE   GPIO15 (output from the panel, ~59 Hz, not needed here)
#   SPI MOSI  GPIO11        Backlight  GPIO5, ACTIVE LOW, PWM dimmable
#   DC        GPIO13        Button     GPIO38, active low, external pull-up
#   RST       GPIO8         CS         tied low on the board (no pin); no MISO/readback
#
# This example draws a clock with a 12-hour dial. The button steps the brightness. To show a picture
# rendered elsewhere instead, see the online_image block at the bottom.

substitutions:
  # Keep "radar21en" for the FIRST upload through the stock firmware's /api/ota (it checks this).
  # Once ESPHome is running you can rename it.
  name: radar21en
  friendly_name: Radar 360

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: clock_time
    # timezone: Europe/London  # set yours

spi:
  - id: display_spi
    clk_pin: 12
    mosi_pin: 11

display:
  - platform: mipi_spi
    id: disp
    model: custom
    spi_id: display_spi
    dimensions:
      width: 360
      height: 360
    bus_mode: single
    data_rate: 20MHz
    spi_mode: MODE0
    dc_pin: 13
    reset_pin: 8
    color_order: rgb
    invert_colors: false
    rotation: 0  # 0/90/180/270; rotation works because the init below has no 0x36 (MADCTL)
    # GC9B72 init from github.com/MaliosDark/Arduino_GC9B72 (port of xboot fb-gc9b72.c),
    # without its trailing [0x36, 0x00]: that would override ESPHome's rotation.
    init_sequence:
      - [0xFE]
      - [0xEF]
      - [0x80, 0x19]
      - [0x82, 0x09]
      - [0x83, 0x03]
      - [0x88, 0x00]
      - [0x89, 0x38]
      - [0x8A, 0x40]
      - [0x8B, 0x0A]
      - [0x8C, 0x00]
      - [0x81, 0xFF]
      - [0x84, 0xFF]
      - [0x85, 0xFF]
      - [0x86, 0xFF]
      - [0x87, 0xFF]
      - [0x8E, 0xFF]
      - [0x8F, 0xFF]
      - [0x98, 0x3E]
      - [0x99, 0x3E]
      - [0x7D, 0x72]
      - [0x70, 0x02, 0x03, 0x03, 0x06, 0x03, 0x03, 0x09, 0x07, 0x09, 0x03]
      - [0x90, 0x06, 0x06, 0x01, 0x01]
      - [0x93, 0x02, 0xFF, 0x00]
      - [0xCB, 0x02]
      - [0xFB, 0x00, 0x00]
      - [0xF6, 0xC0]
      - [0x6C, 0x00, 0x00, 0x22, 0x00, 0xCC, 0x04, 0x58]
      - [0xAA, 0x0B, 0x00]
      - [0xEC, 0x07]
      - [0xF9, 0x40]
      - [0xEB, 0x01, 0x67]
      - [0x74, 0x01, 0x60, 0x00, 0x00, 0x00, 0x00]
      - [0xB5, 0x14, 0x14, 0x14]
      - [0x6E, 0x0B, 0x0B, 0x09, 0x09, 0x13, 0x13, 0x11, 0x11, 0x16, 0x15, 0x01, 0x04, 0x00, 0x0D, 0x1D, 0x00, 0x00, 0x1D, 0x0D, 0x00, 0x04, 0x08, 0x15, 0x16, 0x12, 0x12, 0x14, 0x14, 0x0A, 0x0A, 0x0C, 0x0C]
      - [0x60, 0x38, 0x1C, 0x13, 0x56]
      - [0x61, 0xF8, 0x0A, 0x13, 0x56]
      - [0x62, 0xF8, 0x0B, 0x13, 0x56]
      - [0x63, 0x38, 0x1C, 0x13, 0x56]
      - [0x64, 0x38, 0x20, 0x72, 0xF8, 0x13, 0x56]
      - [0x65, 0x78, 0x1A, 0x70, 0x0B, 0x56, 0x13]
      - [0x66, 0x38, 0x24, 0x72, 0xFC, 0x13, 0x56]
      - [0x68, 0xB3, 0x08, 0x0E, 0x08, 0x0E, 0x0A, 0x0A]
      - [0x69, 0xB3, 0x08, 0x0E, 0x08, 0x0E, 0x0A, 0x0A]
      - [0x6A, 0x00, 0x00]
      - [0x3A, 0x05]
      - [0x7C, 0xB6, 0x29]
      - [0xAC, 0x40]
      - [0xC3, 0x1A]
      - [0xC4, 0x24]
      - [0xC9, 0x2F]
      - [0xF0, 0x11, 0x17, 0x08, 0x06, 0x05, 0x38]
      - [0xF1, 0x4D, 0x72, 0x72, 0x2D, 0x34, 0x8F]
      - [0xF2, 0x11, 0x17, 0x08, 0x06, 0x05, 0x38]
      - [0xF3, 0x4D, 0x72, 0x72, 0x2D, 0x34, 0x8F]
      - [0xB4, 0x0A]
      - [0x35, 0x00]
      - [0xFE]
      - [0xEE]
    update_interval: 1s
    lambda: |-
      const int C = 180;
      it.fill(Color(4, 8, 14));
      it.filled_circle(C, C, 178, Color(10, 20, 32));
      for (int h = 0; h < 12; h++) {
        float a = h * M_PI / 6;
        int r0 = h % 3 == 0 ? 150 : 160;
        it.line(C + r0 * sinf(a), C - r0 * cosf(a), C + 172 * sinf(a), C - 172 * cosf(a), Color(120, 150, 180));
      }
      auto now = id(clock_time).now();
      if (!now.is_valid()) {
        it.print(C, C, id(f_small), Color(150, 175, 200), TextAlign::CENTER, "waiting for time");
        return;
      }
      float ah = ((now.hour % 12) + now.minute / 60.0f) * M_PI / 6;
      float am = (now.minute + now.second / 60.0f) * M_PI / 30;
      float as = now.second * M_PI / 30;
      it.line(C, C, C + 80 * sinf(ah), C - 80 * cosf(ah), Color(255, 255, 255));
      it.line(C, C, C + 130 * sinf(am), C - 130 * cosf(am), Color(200, 220, 240));
      it.line(C, C, C + 140 * sinf(as), C - 140 * cosf(as), Color(255, 120, 60));
      it.filled_circle(C, C, 5, Color(255, 196, 64));
      it.strftime(C, 250, id(f_big), Color(255, 255, 255), TextAlign::CENTER, "%H:%M", now);
      it.strftime(C, 285, id(f_small), Color(150, 175, 200), TextAlign::CENTER, "%a %d %b", now);

font:
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 40
  - file: "gfonts://Roboto@500"
    id: f_small
    size: 16

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: 5
      inverted: true  # LOW = on
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: 38
      inverted: true
    filters:
      - delayed_on: 20ms
    on_click:
      then:
        - lambda: |-
            // cycle 100% -> 60% -> 30% -> 10% -> 100%
            static const float steps[] = {1.0f, 0.6f, 0.3f, 0.1f};
            static int i = 0;
            i = (i + 1) % 4;
            auto call = id(backlight).turn_on();
            call.set_brightness(steps[i]);
            call.perform();

# --- Show an image rendered somewhere else (e.g. a Home Assistant view), refreshed every 10 s.
# Uncomment, then in the display lambda use:  it.image(0, 0, id(frame_img));
# http_request:
#   timeout: 10s
# online_image:
#   - id: frame_img
#     url: http://your-server/frame.png   # 360x360 PNG
#     format: PNG
#     type: RGB565
