# GeekMagic Radar 360 (model RD03, stock firmware id "radar21en"): minimal ESPHome config.
# 2.1" round 360x360 panel, GC9B72-compatible controller, 4-wire SPI. ESP32-S3R8, 16 MB flash.
# Turns the backlight on and draws a test pattern. Build whatever you like from here.
#
#   SPI CLK   GPIO12        Backlight  GPIO5, ACTIVE LOW, PWM dimmable
#   SPI MOSI  GPIO11        Button     GPIO38, active low, external pull-up
#   DC        GPIO13        Panel TE   GPIO15 (panel output, optional)
#   RST       GPIO8         CS         tied low on the board (no pin)

substitutions:
  # Keep "radar21en" for the FIRST upload through the stock firmware's /api/ota (it checks this).
  name: radar21en

esphome:
  name: ${name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: 12
  mosi_pin: 11

display:
  - platform: mipi_spi
    model: custom
    dimensions:
      width: 360
      height: 360
    bus_mode: single
    data_rate: 20MHz
    spi_mode: MODE0
    dc_pin: 13
    reset_pin: 8
    color_order: rgb
    invert_colors: false
    # GC9B72 init from github.com/MaliosDark/Arduino_GC9B72, minus its final [0x36, 0x00]
    # (that would override ESPHome's rotation: setting).
    init_sequence:
      - [0xFE]
      - [0xEF]
      - [0x80, 0x19]
      - [0x82, 0x09]
      - [0x83, 0x03]
      - [0x88, 0x00]
      - [0x89, 0x38]
      - [0x8A, 0x40]
      - [0x8B, 0x0A]
      - [0x8C, 0x00]
      - [0x81, 0xFF]
      - [0x84, 0xFF]
      - [0x85, 0xFF]
      - [0x86, 0xFF]
      - [0x87, 0xFF]
      - [0x8E, 0xFF]
      - [0x8F, 0xFF]
      - [0x98, 0x3E]
      - [0x99, 0x3E]
      - [0x7D, 0x72]
      - [0x70, 0x02, 0x03, 0x03, 0x06, 0x03, 0x03, 0x09, 0x07, 0x09, 0x03]
      - [0x90, 0x06, 0x06, 0x01, 0x01]
      - [0x93, 0x02, 0xFF, 0x00]
      - [0xCB, 0x02]
      - [0xFB, 0x00, 0x00]
      - [0xF6, 0xC0]
      - [0x6C, 0x00, 0x00, 0x22, 0x00, 0xCC, 0x04, 0x58]
      - [0xAA, 0x0B, 0x00]
      - [0xEC, 0x07]
      - [0xF9, 0x40]
      - [0xEB, 0x01, 0x67]
      - [0x74, 0x01, 0x60, 0x00, 0x00, 0x00, 0x00]
      - [0xB5, 0x14, 0x14, 0x14]
      - [0x6E, 0x0B, 0x0B, 0x09, 0x09, 0x13, 0x13, 0x11, 0x11, 0x16, 0x15, 0x01, 0x04, 0x00, 0x0D, 0x1D, 0x00, 0x00, 0x1D, 0x0D, 0x00, 0x04, 0x08, 0x15, 0x16, 0x12, 0x12, 0x14, 0x14, 0x0A, 0x0A, 0x0C, 0x0C]
      - [0x60, 0x38, 0x1C, 0x13, 0x56]
      - [0x61, 0xF8, 0x0A, 0x13, 0x56]
      - [0x62, 0xF8, 0x0B, 0x13, 0x56]
      - [0x63, 0x38, 0x1C, 0x13, 0x56]
      - [0x64, 0x38, 0x20, 0x72, 0xF8, 0x13, 0x56]
