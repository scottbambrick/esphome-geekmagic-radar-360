      - [0xB4, 0x0A]
      - [0x35, 0x00]
      - [0xFE]
      - [0xEE]
    lambda: |-
      it.fill(Color(0, 40, 90));
      it.filled_circle(180, 180, 60, Color(255, 160, 0));

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: 5
      inverted: true  # LOW = backlight on
    frequency: 20000Hz

light:
  - platform: monochromatic
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
