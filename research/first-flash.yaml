# FIRST FLASH: minimal ESPHome image to replace the stock GeekMagic firmware over Wi-Fi.
# No display. Upload it through the stock web UI's local OTA endpoint (see README):
#   curl -X POST http://<device-ip>/api/ota -H 'Content-Type: application/octet-stream' \
#        --data-binary @firmware.ota.bin
# The stock updater rejects any image whose ESP-IDF app descriptor project_name is not
# "radar21en" (HTTP 400 "Expected radar21en firmware"). ESPHome writes substitutions.name into
# that field, so the name MUST be radar21en for this first upload. After that, ESPHome OTA has no
# such check. There is no way back to stock: GeekMagic doesn't publish the firmware.

substitutions:
  name: radar21en
  friendly_name: Radar 360


esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: # reuses the API encryption key above

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
